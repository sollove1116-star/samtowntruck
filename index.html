html,body{margin:0}
body{background-color:var(--bg);color:var(--text);font:400 16px/1.55 "Noto Sans KR",system-ui,sans-serif;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:520px;margin:0 auto;padding:24px 16px 48px}
h1{font:400 30px/1.2 "Black Han Sans","Noto Sans KR",sans-serif;margin:0 0 4px;display:flex;align-items:center;gap:10px}
h1 svg{width:38px;height:38px;flex:none;color:var(--lit)}
.sub{color:var(--muted);margin:0 0 6px;font-size:14px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding-top:16px;margin-bottom:20px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px 8px;min-height:92px;
  background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;font:inherit;cursor:pointer}
.wd .d{width:100%;max-width:38px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:2px solid transparent;font:900 22px/1 "Noto Sans KR",system-ui,sans-serif}
.names{display:flex;flex-direction:column;gap:4px;width:100%}
.nm{font-size:10.5px;line-height:1.25;color:var(--muted);text-align:center;overflow-wrap:anywhere;word-break:keep-all}
.nm.none{opacity:.6}
.wd{position:relative}
.wd.now::before{content:"★ 오늘 ★";white-space:nowrap;position:absolute;left:-8px;right:-8px;top:-17px;text-align:center;
  font-size:12px;font-weight:700;line-height:1.2;color:var(--orange)}
.wd.sel{background:var(--orange);border-color:var(--orange);color:#fff}
.wd.sel .d,.wd.sel .nm{text-shadow:0 1px 1px rgba(160,60,0,.4)}
.wd.sel .nm{color:#fff;font-weight:700}
.wd:focus-visible,.btn:focus-visible,.add:focus-visible{outline:3px solid var(--lit);outline-offset:2px}

.title{font-weight:700;font-size:18px;margin:0 0 12px}
.lot{display:grid;gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:12px;
  border-radius:10px;scrollbar-width:thin}
.slide{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:16/10;border-radius:10px;border:1px solid var(--line);
  background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.gallery.multi .slide{flex-basis:86%}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide svg{width:72px;height:72px;color:var(--orange)}
.gallery:focus-visible{outline:3px solid var(--lit);outline-offset:2px}
.name{font-weight:700;font-size:18px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.time{display:inline-block;background:var(--lit);color:var(--lit-ink);border-radius:6px;padding:0 8px;font-size:13px;font-weight:700}
.loc{display:inline-block;border:1px solid var(--lit);color:var(--lit);border-radius:6px;padding:0 8px;font-size:13px;font-weight:500}
.menu{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:14px}
.item{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.item .p{font-weight:700;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;margin-top:10px;border-radius:8px;
  background:var(--lit);color:var(--lit-ink);font:700 14px/1 "Noto Sans KR",sans-serif;text-decoration:none}
.msg{text-align:center;color:var(--muted);padding:24px 0}
.msg[hidden]{display:none}
.add{display:block;text-align:center;margin-top:24px;padding:14px;border-radius:12px;
  background:var(--lit);color:var(--lit-ink);font-weight:700;text-decoration:none}
.add[hidden]{display:none}
#splash{position:fixed;inset:0;z-index:100;background:var(--lit);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:24px;cursor:pointer;overflow:hidden;transition:opacity .45s ease}
#splash.hide{opacity:0;pointer-events:none}
.sp-title{font:400 clamp(44px,17vw,84px)/1.12 "Black Han Sans","Noto Sans KR",sans-serif;text-align:center;
  color:#FCF9F0;animation:rise .7s ease-out both}
.sp-title span{display:block}
.sp-title .s1{color:#FFD79A;font-size:.62em;margin-bottom:.12em}
.sp-road{position:relative;width:100%;height:96px}
.sp-truck{position:absolute;bottom:14px;left:0;width:130px;height:87px;color:#FCF9F0;
  animation:drive 2.6s cubic-bezier(.45,.05,.55,.95) .15s both}
.sp-truck svg{width:100%;height:100%;display:block;animation:bump .28s ease-in-out infinite alternate}
@keyframes drive{from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 30px))}}
@keyframes bump{to{transform:translateY(-3px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .sp-truck{animation:none;left:50%;margin-left:-65px}.sp-truck svg,.sp-title{animation:none}
}

<script>

const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRKNt-Nacw9SwbqurM7ktSvNIXinJxvpZGYKef73KTRc8N4vRDcFYFzqOSJscOtmmCTL64wuOlNHoyz/pub?gid=1861893817&single=true&output=csv";   // 구글 시트 "웹에 게시" CSV 주소

/* ========================== */

const DAYS = ["월","화","수","목","금","토","일"];

const DEMO = [
  {days:["월","수","금"],name:"청춘 닭꼬치",time:"17:00–21:00",loc:"111동 앞",phone:"01000000000",

];

const $ = id => document.getElementById(id);
const todayIdx = (new Date().getDay()+6)%7;

function parseCSV(text){
  const out=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'&&text[i+1]==='"'){cell+='"';i++}
      else if(c==='"')q=false;
      else cell+=c;
    }else if(c==='"')q=true;
    else if(c===","){row.push(cell);cell=""}
    else if(c==="\n"){row.push(cell);out.push(row);row=[];cell=""}
    else if(c!=="\r")cell+=c;
  }
  if(cell||row.length){row.push(cell);out.push(row)}
  return out;
}

function parseDays(v){
  v=v||"";
  const set=new Set();
  if(v.includes("매일"))DAYS.forEach(d=>set.add(d));
  if(v.includes("평일"))"월화수목금".split("").forEach(d=>set.add(d));
  if(v.includes("주말"))"토일".split("").forEach(d=>set.add(d));
  v=v.replace(/매일|평일|주말|요일/g,"");
  for(const c of v)if(DAYS.includes(c))set.add(c);
  return DAYS.filter(d=>set.has(d));
}

function toRows(table){
  const head=table[0].map(h=>h.trim());
  const col=k=>head.findIndex(h=>h.includes(k));
  const ix={days:col("요일"),name:col("트럭"),photo:col("사진"),menu:col("메뉴"),time:col("시간"),loc:col("위치"),phone:col("전화")};
  const get=(r,i)=>i<0?"":(r[i]||"").trim();
  return table.slice(1).map(r=>({
    days:parseDays(get(r,ix.days)),
    name:get(r,ix.name),
    photo:get(r,ix.photo),
    menu:get(r,ix.menu),
    time:get(r,ix.time),
    loc:get(r,ix.loc),
    phone:get(r,ix.phone).replace(/[^\d+]/g,"")
  })).filter(r=>r.name&&r.days.length);
}

function el(tag,cls,text){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(text!==undefined)e.textContent=text;   // 주민 입력은 항상 텍스트로만 표시
  return e;
}

function photoUrl(v){
  if(!v)return "";
  const g=v.match(/drive\.google\.com.*?(?:[?&]id=|\/d\/)([\w-]{10,})/);
  if(g)return "https://drive.google.com/thumbnail?id="+g[1]+"&sz=w400";
  if(/^https?:\/\//i.test(v))return v;
  if(/^[^\/\\:]+\.(jpe?g|png|webp|gif)$/i.test(v))return "photos/"+encodeURIComponent(v);
  return "";
}

function gallery(t){
  const urls=(t.photo||"").split(/[,;\n]+/).map(x=>photoUrl(x.trim())).filter(Boolean).slice(0,8);
  const g=el("div","gallery"+(urls.length>1?" multi":""));
  if(!urls.length){
    const s=el("div","slide");s.innerHTML=ICON;g.appendChild(s);
    return g;
  }
  g.setAttribute("role","group");
  g.setAttribute("aria-label",t.name+" 사진");
  if(urls.length>1)g.tabIndex=0;
  urls.forEach((u,k)=>{
    const s=el("div","slide");
    const img=document.createElement("img");
    img.alt=t.name+" 사진 "+(k+1);img.loading="lazy";
    img.onerror=()=>{s.innerHTML=ICON};
    img.src=u;
    s.appendChild(img);g.appendChild(s);
  });
  return g;
}

function menuLine(x){
  const row=el("div","item");
  const m=x.match(/^(.+?)\s+(\d[\d,]*\s*원?)$/);
  if(m){row.appendChild(el("span","",m[1]));row.appendChild(el("span","p",m[2]))}
  else row.appendChild(el("span","",x));
  return row;
}

function card(t){
  const c=el("div","card");
  c.appendChild(gallery(t));
  const body=el("div");
  body.appendChild(el("div","name",t.name));
  if(t.time||t.loc){
    const chips=el("div","chips");
    if(t.time)chips.appendChild(el("span","time",t.time));
    if(t.loc)chips.appendChild(el("span","loc",t.loc));
    body.appendChild(chips);
  }
  const lines=(t.menu||"").split("\n").map(x=>x.trim()).filter(Boolean);
  if(lines.length){
    const m=el("div","menu");
    lines.forEach(x=>m.appendChild(menuLine(x)));
    body.appendChild(m);
  }
  if((t.phone||"").length>=8){
    const a=el("a","btn");
    a.innerHTML=PHONE;
    a.appendChild(document.createTextNode("예약하기"));
    a.href="tel:"+t.phone;
    a.setAttribute("aria-label",t.name+" 예약하기, 전화 연결");
    body.appendChild(a);
  }
  c.appendChild(body);
  return c;
}

function buildWeek(){
  const wk=$("week");wk.replaceChildren();chips=[];
  DAYS.forEach((d,i)=>{
    const list=rows.filter(r=>r.days.includes(d));
    const b=el("button","wd"+(i===todayIdx?" now":""));
    b.type="button";
    b.setAttribute("aria-label",d+"요일"+(i===todayIdx?"(오늘)":"")+", "+(list.length?list.map(t=>t.name).join(", "):"등록된 트럭 없음"));
    b.appendChild(el("span","d",d));
    const names=el("span","names");
    if(list.length)list.forEach(t=>names.appendChild(el("span","nm",t.name)));
    else names.appendChild(el("span","nm none","–"));
    b.appendChild(names);
    b.onclick=()=>showDay(i);
    wk.appendChild(b);chips.push(b);
  });
}

function showDay(i){
  cur=i;
  chips.forEach((c,j)=>{c.classList.toggle("sel",j===i);c.setAttribute("aria-pressed",String(j===i))});
  $("title").textContent=DAYS[i]+"요일"+(i===todayIdx?" · 오늘":"");
  const lot=$("lot");lot.replaceChildren();
  const list=rows.filter(r=>r.days.includes(DAYS[i]));
  list.slice().sort((a,b)=>(a.time||"").localeCompare(b.time||"")).forEach(t=>lot.appendChild(card(t)));
  if(!failed){
    if(loading){$("msg").hidden=false;$("msg").textContent="소식을 불러오는 중이에요…"}
    else{
      $("msg").hidden=list.length>0;
      $("msg").textContent="이 요일에는 등록된 트럭이 없어요. 알고 계시면 알려주세요.";
    }
  }
}

async function load(){
  if(!SHEET_CSV_URL){rows=DEMO}
  else{
    buildWeek();showDay(cur);
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),10000);
    try{
      const res=await fetch(SHEET_CSV_URL+(SHEET_CSV_URL.includes("?")?"&":"?")+"t="+Date.now(),{signal:ctl.signal});
      if(!res.ok)throw new Error(res.status);
      rows=toRows(parseCSV(await res.text()));
    }catch(e){
      rows=[];failed=true;
      $("msg").hidden=false;$("msg").textContent="소식을 불러오지 못했어요. 잠시 후 다시 열어주세요.";
    }finally{clearTimeout(timer)}
  }
  loading=false;
  buildWeek();showDay(cur);
}

if(FORM_URL){$("add").href=FORM_URL;$("add").hidden=false}
load();
</script>
</body>
</html>
